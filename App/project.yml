# Generate the Xcode project with `xcodegen generate` in this directory.
# The bundle identifier is the one registered with Apple, with MusicKit switched on for it.
name: Tandem
options:
  bundleIdPrefix: com.tandemplayer
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    tvOS: "17.0"
  createIntermediateGroups: true
packages:
  SendspinClientKit:
    path: ../Packages/SendspinClientKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Tandem
    PRODUCT_BUNDLE_IDENTIFIER: com.tandemplayer.tandemplayer
targets:
  Tandem-iOS:
    type: application
    platform: iOS
    sources: [Tandem]
    # A scheme kept in the project, so it's there whatever Xcode's own per-user list holds.
    scheme: {}
    dependencies:
      - package: SendspinClientKit
        product: SendspinClientKit
      - package: SendspinClientKit
        product: MusicAssistantKit
    info:
      path: Generated/Info-iOS.plist
      properties:
        CFBundleDisplayName: Tandem
        UILaunchScreen: {}
        # Keeps the connection and playback alive while audio plays in the background.
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Tandem finds and connects to Sendspin servers, such as Music Assistant, on your network.
        NSBonjourServices: ["_sendspin-server._tcp", "_mass._tcp"]
        # Sendspin uses plain ws:// on the local network (it encrypts inside the connection),
        # and servers serve artwork over http there.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        # Xcode manages the provisioning profile, for running on a real device.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CTGZ35NG7K
  # The Apple TV: a player in time with the others, and the library from the sofa. It's no
  # server, and has no web view, so it leaves the Host and Music Assistant screens out.
  Tandem-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Tandem
        # There's no web view on an Apple TV.
        excludes: [MusicAssistantWebView.swift]
    scheme: {}
    dependencies:
      - package: SendspinClientKit
        product: SendspinClientKit
      - package: SendspinClientKit
        product: MusicAssistantKit
    info:
      path: Generated/Info-tvOS.plist
      properties:
        CFBundleDisplayName: Tandem
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSLocalNetworkUsageDescription: Tandem finds and connects to Sendspin servers, such as Music Assistant, on your network.
        NSBonjourServices: ["_sendspin-server._tcp", "_mass._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "3"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CTGZ35NG7K
  Tandem-macOS:
    type: application
    platform: macOS
    sources: [Tandem]
    # A scheme kept in the project, so it's there whatever Xcode's own per-user list holds.
    scheme: {}
    dependencies:
      - package: SendspinClientKit
        product: SendspinClientKit
      - package: SendspinClientKit
        product: MusicAssistantKit
      # The server this Mac can be, for other devices to play from.
      - package: SendspinClientKit
        product: TandemServerKit
    info:
      path: Generated/Info-macOS.plist
      properties:
        CFBundleDisplayName: Tandem
        LSApplicationCategoryType: public.app-category.music
        # The Host plays Apple Music through MusicKit and hears it with a tap on system audio.
        NSAppleMusicUsageDescription: Tandem searches Apple Music and plays its songs on your speakers.
        NSAudioCaptureUsageDescription: Tandem captures the Apple Music songs it plays, to send them to your speakers in sync.
        NSLocalNetworkUsageDescription: Tandem finds and connects to Sendspin servers, such as Music Assistant, on your network.
        # The last two are for the Host: the players and the AirPlay speakers it looks for.
        NSBonjourServices: ["_sendspin-server._tcp", "_mass._tcp", "_sendspin._tcp", "_raop._tcp"]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        # Signed with the development certificate, without the App Sandbox. A stable signature
        # matters: the Keychain ties its items to it, and asks for the login password again
        # whenever an ad-hoc signed build changes. The sandbox comes with distribution.
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: CTGZ35NG7K
